name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: tag and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag that does not name the version being published produces a release
      # nobody can trace back to a commit.
      - name: Tag matches the workspace version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v${tag} does not match workspace version ${manifest}"
            exit 1
          fi

      # Only what survived the gates on main may be published.
      - name: Tag commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

  gates:
    name: gates
    needs: validate
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

      # Packaging is re-verified here for the same reason the tests are: a tag
      # can be created before the merge-time run finishes, or after it was
      # cancelled, and the ancestry check still passes. A package-only defect
      # found by `cargo publish` would be found after the upload had already
      # happened and could not be recalled.
      #
      # This is the publish minus the upload, not `cargo package --workspace`:
      # packaging is a publication concern, and the conformance crates and the
      # FFI shim are never published. Requiring them to package would force
      # version requirements onto path dependencies that no shipment will ever
      # read. That they still build is what `cargo test --workspace` above
      # proves.
      - run: cargo publish -p composition-ir --dry-run

  # What a binding links. Every target here shares one ABI -- 64-bit, little
  # endian, `u64` 8-aligned -- which is not a coincidence and not checked by
  # eye: `layout.rs` refuses at compile time to build for an ABI that
  # `abi/layout.json` does not describe, so a target needing its own manifest
  # cannot silently join this list. Android's `x86` ABI is the one that will
  # hit it.
  bundle:
    name: ${{ matrix.target }}
    needs: gates
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-latest }
          - { target: aarch64-apple-ios, runner: macos-latest }
          - { target: aarch64-apple-ios-sim, runner: macos-latest }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: .github/scripts/bundle.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to crates.io
    # Also on the bundles: publishing to crates.io cannot be undone, only
    # yanked, so nothing irreversible happens until the artifacts a consumer
    # will look for are known to build.
    needs: [gates, bundle]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # Trusted Publishing: this job proves its identity to crates.io with a
      # short-lived OIDC token instead of a long-lived registry token. Nothing
      # publishable is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # Exchanges the workflow's OIDC identity for a crates.io token that lives
      # for the length of this job. crates.io grants it only if the crate has
      # this repository, this workflow file, and this environment registered as
      # a trusted publisher, so a fork or a renamed workflow gets nothing.
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # One crate, so no dependency ordering and no waiting for the index.
      # `--no-verify` is deliberately not used: the package must build from what
      # was actually packaged.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p composition-ir

  # The GitHub release is what a non-Rust consumer downloads; crates.io serves
  # only the Rust dependent. It is created last so a release never exists
  # advertising a version that failed to publish.
  release:
    name: attach the artifacts
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      # A download that produced nothing would otherwise publish an empty
      # release, which looks like a release.
      - name: Checksums over what actually arrived
        run: |
          set -euo pipefail
          cd dist
          count=$(ls -1 *.tar.gz 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no bundles were downloaded; the release would be empty"
            exit 1
          fi
          sha256sum *.tar.gz | tee SHA256SUMS
          echo "attaching ${count} bundles"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
