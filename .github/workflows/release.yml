name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: tag and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag that does not name the version being published produces a release
      # nobody can trace back to a commit.
      - name: Tag matches the workspace version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v${tag} does not match workspace version ${manifest}"
            exit 1
          fi

      # Only what survived the gates on main may be published.
      - name: Tag commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

  gates:
    name: gates
    needs: validate
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  publish:
    name: publish to crates.io
    needs: gates
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # Trusted Publishing: this job proves its identity to crates.io with a
      # short-lived OIDC token instead of a long-lived registry token. Nothing
      # publishable is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # Exchanges the workflow's OIDC identity for a crates.io token that lives
      # for the length of this job. crates.io grants it only if the crate has
      # this repository, this workflow file, and this environment registered as
      # a trusted publisher, so a fork or a renamed workflow gets nothing.
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Dependency order, because a dependent cannot resolve a version that is
      # not on the index yet. `--no-verify` is deliberately not used: the
      # package must build from what was actually packaged.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in composition-ir composition-derive composition-ir-ffi; do
            echo "::group::publish ${crate}"
            cargo publish -p "${crate}"
            echo "::endgroup::"
            # the index needs a moment before a dependent can resolve it
            for _ in $(seq 1 30); do
              cargo search "${crate}" --limit 1 | grep -q "^${crate} = \"${GITHUB_REF_NAME#v}\"" && break
              sleep 10
            done
          done
