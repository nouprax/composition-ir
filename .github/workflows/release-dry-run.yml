name: release dry run

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The same matrix the release builds, running the same script. Not a subset:
  # a target that fails to build is found at the tag otherwise, which is the
  # one moment nothing can be done about it. The cost is runner minutes, and
  # `docs/direction.md` already accepted that trade for exactly this class of
  # thing when it put the bindings in this repository.
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-latest }
          - { target: aarch64-apple-ios, runner: macos-latest }
          - { target: aarch64-apple-ios-sim, runner: macos-latest }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: .github/scripts/bundle.sh ${{ matrix.target }}

      # The archive is opened rather than trusted. `bundle.sh` checks the files
      # it staged; this checks what came out the other end of `tar`, which is
      # what a consumer will actually unpack.
      - name: The bundle carries what a binding needs
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          name="composition-ir-${version}-${{ matrix.target }}"
          tar -tzf "dist/${name}.tar.gz" > /tmp/listing
          missing=0
          for entry in \
            "${name}/include/composition_ir.h" \
            "${name}/abi/layout.json" \
            "${name}/lib/libcomposition_ir_ffi.a" \
            "${name}/LICENSE"
          do
            grep -qx "$entry" /tmp/listing || { echo "::error::${name}.tar.gz has no ${entry}"; missing=1; }
          done
          grep -qE "${name}/lib/libcomposition_ir_ffi\.(dylib|so)$" /tmp/listing \
            || { echo "::error::${name}.tar.gz carries no shared library"; missing=1; }
          exit $missing

  dry-run:
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2

      # The release path must be exercisable without credentials, or it stays a
      # hypothesis until the first tag, which is the worst moment to find out
      # that it does not work.
      - name: Prove the dry run has no release credentials
        run: |
          test -z "${CARGO_REGISTRY_TOKEN:-}"
          test -z "${CARGO_REGISTRIES_CRATES_IO_TOKEN:-}"

      # Publishing now authenticates with a short-lived OIDC token minted at
      # run time, so nothing publishable should be stored in the repository.
      # This parses the workflow rather than grepping it: a commented-out
      # permission, or one that drifted to another job, satisfies a text search
      # while leaving the publish job unable to authenticate.
      - name: The publish job mints its credential rather than storing one
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PYEOF'
          import sys, yaml

          wf = yaml.safe_load(open(".github/workflows/release.yml"))
          job = wf["jobs"]["publish"]
          steps = job.get("steps", [])
          problems = []

          if job.get("permissions", {}).get("id-token") != "write":
              problems.append("jobs.publish does not request id-token: write")

          if not any("crates-io-auth-action" in str(s.get("uses", "")) for s in steps):
              problems.append("jobs.publish does not run the crates.io auth action")

          if "crates-io" != job.get("environment"):
              problems.append("jobs.publish is not bound to the crates-io environment")

          stored = [
              s.get("name", "<unnamed>")
              for s in steps
              if "secrets.CARGO_REGISTRY_TOKEN" in str(s.get("env", "")) + str(s.get("run", ""))
          ]
          if stored:
              problems.append(f"jobs.publish reads a stored token in: {stored}")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("jobs.publish authenticates by OIDC, in the crates-io environment")
          PYEOF

      # The dry run above is only evidence about the release if it builds the
      # same set. Two matrices in two files drift the moment one is edited, and
      # the drift is invisible: the dry run goes on passing while covering less
      # than it ships. Ordering is checked here too -- a `cargo publish` that
      # did not wait for the bundles could put a version on crates.io whose
      # artifacts never built, and that cannot be undone, only yanked.
      - name: The dry run builds what the release ships, and in an order that can fail safely
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PYEOF'
          import sys, yaml

          release = yaml.safe_load(open(".github/workflows/release.yml"))["jobs"]
          dry = yaml.safe_load(open(".github/workflows/release-dry-run.yml"))["jobs"]
          problems = []

          def targets(jobs, name):
              entries = jobs.get(name, {}).get("strategy", {}).get("matrix", {}).get("include", [])
              return {e["target"] for e in entries}

          shipped, exercised = targets(release, "bundle"), targets(dry, "bundle")
          if not shipped:
              problems.append("release.yml builds no targets, so this check is vacuous")
          if shipped != exercised:
              problems.append(
                  f"the dry run does not build {sorted(shipped - exercised)} "
                  f"and builds {sorted(exercised - shipped)} that no release ships"
              )

          def needs(jobs, name):
              n = jobs.get(name, {}).get("needs", [])
              return [n] if isinstance(n, str) else n

          if "bundle" not in needs(release, "publish"):
              problems.append("jobs.publish does not wait for the bundles; crates.io cannot be undone")
          if "publish" not in needs(release, "release"):
              problems.append("jobs.release does not wait for the publish, so a release can advertise a version that is not on crates.io")
          if release.get("release", {}).get("permissions", {}).get("contents") != "write":
              problems.append("jobs.release cannot write contents, so it cannot attach anything")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("the dry run builds", sorted(shipped), "and the release cannot publish before they do")
          PYEOF

      - name: The tag the release job would accept
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) echo "a release of this commit would be tagged v${version}" ;;
            *) echo "::error::workspace version ${version} is not exact SemVer"; exit 1 ;;
          esac

      # The whole publish, minus the upload -- byte-identical to what the
      # release job runs before it uploads. This became possible when the
      # workspace collapsed to one published crate: while there were three, a
      # dependent could not be dry-run against a sibling version that was not on
      # the index yet, so the dry run had to skip exactly the crates most likely
      # to break.
      #
      # Deliberately not `cargo package --workspace`. Packaging is a publication
      # concern, and it demands a version requirement on every path dependency;
      # the conformance crates and the FFI shim are never published, so that
      # demand would be enforcing a rule about a shipment that will never
      # happen. That they build is settled by `cargo test --workspace` in CI.
      - name: Publish dry run
        run: cargo publish -p composition-ir --dry-run

      # An internal dependency declared by path alone is rejected only at
      # publish time. With one publishable crate this cannot bite today, and it
      # is kept because the moment a second one is added it can.
      - name: Every internal dependency declares a version
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys
          meta = json.loads(
              subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"])
          )
          members = {p["name"] for p in meta["packages"]}
          bad = [
              f'{p["name"]} -> {d["name"]}'
              for p in meta["packages"]
              if p["publish"] != []
              for d in p["dependencies"]
              if d["name"] in members and d["req"] == "*"
          ]
          if bad:
              print("::error::internal dependencies declared by path alone: " + ", ".join(bad))
              sys.exit(1)
          print("every internal dependency of a publishable crate carries a version")
          PYEOF

      - name: Nothing unpublishable is marked publishable
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys
          meta = json.loads(
              subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"])
          )
          expected = {"composition-ir"}
          actual = {p["name"] for p in meta["packages"] if p["publish"] != []}
          if actual != expected:
              print(f"::error::publishable set is {sorted(actual)}, expected {sorted(expected)}")
              sys.exit(1)
          print("publishable:", sorted(actual))
          PYEOF
