name: release dry run

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2

      # The release path must be exercisable without credentials, or it stays a
      # hypothesis until the first tag, which is the worst moment to find out
      # that it does not work.
      - name: Prove the dry run has no release credentials
        run: |
          test -z "${CARGO_REGISTRY_TOKEN:-}"
          test -z "${CARGO_REGISTRIES_CRATES_IO_TOKEN:-}"

      # Publishing now authenticates with a short-lived OIDC token minted at
      # run time, so nothing publishable should be stored in the repository.
      # This parses the workflow rather than grepping it: a commented-out
      # permission, or one that drifted to another job, satisfies a text search
      # while leaving the publish job unable to authenticate.
      - name: The publish job mints its credential rather than storing one
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PYEOF'
          import sys, yaml

          wf = yaml.safe_load(open(".github/workflows/release.yml"))
          job = wf["jobs"]["publish"]
          steps = job.get("steps", [])
          problems = []

          if job.get("permissions", {}).get("id-token") != "write":
              problems.append("jobs.publish does not request id-token: write")

          if not any("crates-io-auth-action" in str(s.get("uses", "")) for s in steps):
              problems.append("jobs.publish does not run the crates.io auth action")

          if "crates-io" != job.get("environment"):
              problems.append("jobs.publish is not bound to the crates-io environment")

          stored = [
              s.get("name", "<unnamed>")
              for s in steps
              if "secrets.CARGO_REGISTRY_TOKEN" in str(s.get("env", "")) + str(s.get("run", ""))
          ]
          if stored:
              problems.append(f"jobs.publish reads a stored token in: {stored}")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("jobs.publish authenticates by OIDC, in the crates-io environment")
          PYEOF

      - name: Nothing unpublishable is marked publishable
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys
          meta = json.loads(
              subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"])
          )
          expected = {"composition-ir", "composition-derive", "composition-ir-ffi"}
          actual = {p["name"] for p in meta["packages"] if p["publish"] != []}
          if actual != expected:
              print(f"::error::publishable set is {sorted(actual)}, expected {sorted(expected)}")
              sys.exit(1)
          print("publishable:", sorted(actual))
          PYEOF
