name: release dry run

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2

      # The release path must be exercisable without credentials, or it stays a
      # hypothesis until the first tag, which is the worst moment to find out
      # that it does not work.
      - name: Prove the dry run has no release credentials
        run: |
          test -z "${CARGO_REGISTRY_TOKEN:-}"
          test -z "${CARGO_REGISTRIES_CRATES_IO_TOKEN:-}"

      # Publishing now authenticates with a short-lived OIDC token minted at
      # run time, so nothing publishable should be stored in the repository.
      # This parses the workflow rather than grepping it: a commented-out
      # permission, or one that drifted to another job, satisfies a text search
      # while leaving the publish job unable to authenticate.
      - name: The publish job mints its credential rather than storing one
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PYEOF'
          import sys, yaml

          wf = yaml.safe_load(open(".github/workflows/release.yml"))
          job = wf["jobs"]["publish"]
          steps = job.get("steps", [])
          problems = []

          if job.get("permissions", {}).get("id-token") != "write":
              problems.append("jobs.publish does not request id-token: write")

          if not any("crates-io-auth-action" in str(s.get("uses", "")) for s in steps):
              problems.append("jobs.publish does not run the crates.io auth action")

          if "crates-io" != job.get("environment"):
              problems.append("jobs.publish is not bound to the crates-io environment")

          stored = [
              s.get("name", "<unnamed>")
              for s in steps
              if "secrets.CARGO_REGISTRY_TOKEN" in str(s.get("env", "")) + str(s.get("run", ""))
          ]
          if stored:
              problems.append(f"jobs.publish reads a stored token in: {stored}")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("jobs.publish authenticates by OIDC, in the crates-io environment")
          PYEOF

      - name: The tag the release job would accept
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) echo "a release of this commit would be tagged v${version}" ;;
            *) echo "::error::workspace version ${version} is not exact SemVer"; exit 1 ;;
          esac

      # The whole publish, minus the upload. This became possible when the
      # workspace collapsed to one published crate: while there were three, a
      # dependent could not be dry-run against a sibling version that was not on
      # the index yet, so the dry run had to skip exactly the crates most likely
      # to break.
      - name: Publish dry run
        run: cargo publish -p composition-ir --dry-run

      # The rest of the workspace still has to package: a crate that stops
      # packaging is a crate that cannot be published later.
      - name: Package and verify every crate
        run: cargo package --workspace

      # An internal dependency declared by path alone is rejected only at
      # publish time. With one publishable crate this cannot bite today, and it
      # is kept because the moment a second one is added it can.
      - name: Every internal dependency declares a version
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys
          meta = json.loads(
              subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"])
          )
          members = {p["name"] for p in meta["packages"]}
          bad = [
              f'{p["name"]} -> {d["name"]}'
              for p in meta["packages"]
              if p["publish"] != []
              for d in p["dependencies"]
              if d["name"] in members and d["req"] == "*"
          ]
          if bad:
              print("::error::internal dependencies declared by path alone: " + ", ".join(bad))
              sys.exit(1)
          print("every internal dependency of a publishable crate carries a version")
          PYEOF

      - name: Nothing unpublishable is marked publishable
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys
          meta = json.loads(
              subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"])
          )
          expected = {"composition-ir"}
          actual = {p["name"] for p in meta["packages"] if p["publish"] != []}
          if actual != expected:
              print(f"::error::publishable set is {sorted(actual)}, expected {sorted(expected)}")
              sys.exit(1)
          print("publishable:", sorted(actual))
          PYEOF
