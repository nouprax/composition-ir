name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The contracts in docs/specs are normative and every rule cites the gate
      # that checks it. This job is what makes that true rather than aspirational.
      - name: Contract gates
        run: cargo test --workspace --all-targets

      - name: Doc tests
        run: cargo test --workspace --doc

      # Packaging breaks in ways the test suite cannot see -- a missing file, an
      # excluded module, a path dependency without a version. Catching it here
      # means a release tag never fails halfway through publishing.
      #
      # Scoped to the crate that ships rather than the whole workspace, because
      # packaging is a publication concern: it demands a version requirement
      # from every path dependency it touches, and the conformance crates and
      # the FFI shim are never published. That they build is settled above.
      - name: Packaging
        run: cargo publish -p composition-ir --dry-run --allow-dirty

  contracts:
    name: contracts cite gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A rule with no gate is a rule that will be violated silently, so a
      # contract that grows a citation without a test fails here as well as in
      # the suite that owns it.
      - name: Every cited gate exists
        run: |
          set -euo pipefail
          # Test files are discovered rather than read from a hardcoded tree, so
          # moving a package cannot silently turn this check into a no-op. That
          # is not hypothetical: the previous `crates/*/tests/` spelling would
          # have started matching nothing the moment anything moved, and a check
          # that finds no files is a check that passes.
          test_dirs=$(find . -path ./target -prune -o -type d -name tests -print)
          if [ -z "$test_dirs" ]; then
            echo "::error::found no test directories; this check would pass vacuously"
            exit 1
          fi
          echo "searching:" $test_dirs
          fail=0
          for spec in docs/specs/*.md; do
            for gate in $(grep -o '\[`[a-z_][a-z_0-9]*`\]' "$spec" 2>/dev/null | tr -d '[`]' | sort -u); do
              if ! grep -rq "fn ${gate}(" $test_dirs; then
                echo "::error file=${spec}::cites a gate that does not exist: ${gate}"
                fail=1
              fi
            done
          done
          exit $fail
