[workspace]
resolver = "3"
members = [
    "crates/composition-ir",
    "crates/frontend-conformance",
    "crates/composition-ir-ffi",
    "crates/backend-conformance",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/nouprax/composition-ir"
readme = "README.md"
keywords = ["incremental", "diff", "document", "ir", "persistent"]
categories = ["data-structures", "text-processing"]

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
