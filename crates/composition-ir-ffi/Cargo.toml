[package]
name = "composition-ir-ffi"
version.workspace = true
description = "C ABI for Composition IR"
edition.workspace = true
# Not published: crates.io distributes source for Rust dependents, and no Rust
# dependent wants an FFI shim. A C consumer links the built library.
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
composition-ir = { path = "../composition-ir" }

[lints]
workspace = true
